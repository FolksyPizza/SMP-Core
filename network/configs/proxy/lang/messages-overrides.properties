# Restyled Velocity error screens, matching PizzaProxyGuard's own screens. MiniMessage; <arg:N> are Velocity's
# placeholders. Merge into the proxy's lang/ folder with scripts/apply-proxy-messages.sh <proxy dir>, then
# restart the proxy. Only the keys below are replaced; everything else stays Velocity's.
velocity.error.already-connected=<gray>You are already on that server.</gray>
velocity.error.already-connected-proxy=<white>Already connected</white><newline><gray>This account is already online. If you just lost connection, wait a moment and try again.</gray>
velocity.error.already-connecting=<gray>Connecting you already, one moment.</gray>
velocity.error.cant-connect=<white>Could not connect</white><newline><gray><arg:0>: <arg:1></gray><newline><newline><gray>Please try again in a moment.</gray>
velocity.error.connecting-server-error=<white>Could not connect</white><newline><gray>We could not connect you to <arg:0> right now.</gray><newline><newline><gray>Please try again in a moment.</gray>
velocity.error.connected-server-error=<white>Connection lost</white><newline><gray>Your connection to <arg:0> ran into a problem.</gray><newline><newline><gray>Please reconnect.</gray>
velocity.error.internal-server-connection-error=<white>Connection error</white><newline><gray>Something went wrong between our servers.</gray><newline><newline><gray>Please reconnect.</gray>
velocity.error.logging-in-too-fast=<white>Slow down</white><newline><gray>You are reconnecting too quickly. Wait a few seconds and try again.</gray>
velocity.error.online-mode-only=<white>Not signed in</white><newline><gray>Sign in to your Minecraft account, restart the game and try again.</gray>
velocity.error.player-connection-error=<white>Connection error</white><newline><gray>Something went wrong with your connection.</gray><newline><newline><gray>Please reconnect.</gray>
velocity.error.moved-to-new-server=<white>Disconnected from <arg:0></white><newline><gray><arg:1></gray>
velocity.error.no-available-servers=<white>No servers available</white><newline><gray>Every server is offline right now.</gray><newline><newline><gray>Please try again in a few minutes.</gray>
