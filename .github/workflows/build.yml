name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every plugin
        run: ./gradlew build --no-daemon
      - name: Boot check on Paper
        run: tools/ci/boot-check.sh build/dist build/boot-check
      - name: Server log
        if: always()
        run: cat build/boot-check/server.out 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: smp-core-${{ github.sha }}
          path: build/dist/*.jar
          if-no-files-found: error
