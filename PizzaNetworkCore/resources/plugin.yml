name: PizzaNetworkCore
version: 1.0.0
main: dev.pizzasmp.networkcore.PizzaNetworkCore
api-version: '1.21'
# NOT YET TRUE — this flag only controls whether Folia will let the plugin load, and it is
# left on so a Folia boot can be TESTED. Two things must land before it is honest: the
# ProtocolLib dependency below (ProtocolLib does not support Folia, and this plugin imports
# its classes directly, so it cannot even class-load there), and an audit of the scheduler
# use, which is only partly adapted. See docs/notes/CANOPY-PREP-PLAN.md.
folia-supported: true
authors: [PizzaSMP]
description: PizzaSMP core UX plugin (join/quit suppression, guide/settings/stats GUIs)
# ProtocolLib is a HARD class-load dependency: this plugin imports com.comphenix.protocol.*
# directly for four packet listeners. Without this declaration its absence surfaced as an
# unexplained failure inside PluginClassLoader.<init>, before any guard in the code could run
# or report anything useful. Declaring it makes the failure name itself.
softdepend: [ProtocolLib]
libraries:
  - org.mariadb.jdbc:mariadb-java-client:3.5.4
  - com.zaxxer:HikariCP:5.1.0
commands:
  spawn:
    usage: /spawn
    description: Teleport to the network lobby spawn.
  warp:
    usage: /warp <spawn>
    description: Warp to a network destination.
  # DELIBERATELY UNREGISTERED (2026-08-07) — maintenance moved to CLI (scripts/).
  #   admin, manage  - the in-game consoles. Removed to bound the blast radius of a
  #                    LuckPerms permission leak: they put maintenance, world access,
  #                    economy and feature flags behind one node. Handler code
  #                    (openManageConsole / openAdmin*) is intentionally LEFT IN PLACE
  #                    but unreachable; unregistering is the security win, and deleting
  #                    it would be a large churn pass through a 20k-line class.
  #   region         - HIDDEN, not removed. It is ~60 call sites (world-access engine,
  #                    closed_worlds channel, limbo hold), and a Folia-era variant will
  #                    reuse it. The machinery stays; only the command is gone.
  #   maintenancemotd- removed. It wrote into kennytv Maintenance's config.yml, which we
  #                    no longer run. MOTD control now lives in PizzaProxyGuard, driven
  #                    from the CLI.
  # See docs/notes/MAINTENANCE-MODEL.md.
  settings:
    usage: /settings
  stats:
    usage: /stats [player]
  shop:
    usage: /shop [reload]
  # /block is a separate registration rather than an alias of /ignore: onCommand switches on the
  # registered command name, so an alias would arrive indistinguishable from /ignore and the
  # messages back would use the wrong word.
  ignore:
    usage: /ignore [player|list]
  block:
    usage: /block [player|list]
  unignore:
    usage: /unignore <player>
  unblock:
    usage: /unblock <player>
  sell:
    usage: /sell [all|reload]
  ah:
    usage: /ah
    aliases: [auction]
  orders:
    usage: /orders
    aliases: [order]
  baltop:
    usage: /baltop
  leaderboard:
    usage: /leaderboard [category]
    aliases: [leaderboards]
  bounty:
    usage: /bounty [player] [amount]
    aliases: [bounties]
  queuetest:
    usage: /queuetest
    description: Force-enqueue yourself to test the join queue (admin).
  vdthrottle:
    usage: /vdthrottle [player|set <n>|reset]
    description: View/control the view-distance throttle (admin).
  nv:
    usage: /nv [player]
    description: Toggle infinite night vision (same state as the /settings toggle).
    aliases: [nightvision]
  tpauto:
    usage: /tpauto
    description: Toggle auto-accepting incoming TPA requests (same state as /settings).
  discord:
    usage: /discord
  homes:
    usage: /homes
  kill:
    usage: /kill
  limbomaint:
    usage: /limbomaint <start|stop|status>
    description: Full-stop limbo maintenance (transfer players to limbo, restart SMP).
    aliases: [limbo]
    permission: pizzasmp.admin.console
  branding:
    usage: /branding [status] | /branding set <pizzasmp|horizonsmp>
    description: Switch the active server brand profile (PizzaSMP/HorizonSMP).
    permission: pizzasmp.admin.console
  worth:
    usage: /worth [item]
  sellmulti:
    usage: /sellmulti
  team:
    usage: /team [create|invite|accept|decline|kick|leave|promote|demote|transfer|disband|sethome|home|info|chat|settings|gui]
    aliases: [teams]
  friend:
    usage: /friend [add|accept|deny|remove|list|requests]
    aliases: [friends]
  follow:
    usage: /follow <player>
  unfollow:
    usage: /unfollow <player>
  sethome:
    usage: /sethome [name]
  delhome:
    usage: /delhome [name]
  home:
    usage: /home [name]
    description: Open the homes GUI or teleport to a named home.
  rtp:
    usage: /rtp [east|nether|end]
    description: Random teleport.
  rtpq:
    usage: /rtpq
    description: Queue for a gear-matched RTP duel.
    aliases: [rtpqueue]
  ecobot:
    usage: /ecobot [status|list|order|buy|deliver|clear|reload|pause|resume]
  tpa:
    usage: /tpa <player>
  tpahere:
    usage: /tpahere <player>
  tpacancel:
    usage: /tpacancel
  tpaaccept:
    usage: /tpaaccept [player]
    aliases: [tpaccept]
  tpadeny:
    usage: /tpadeny [player]
    aliases: [tpdeny]
  ping:
    usage: /ping
  sus:
    usage: /sus
    aliases: [suspicious]
  viewdistance:
    usage: /viewdistance <distance>
  diagnostics:
    usage: /diagnostics
  shards:
    usage: /shards give <player> <amount>
  reset:
    usage: /reset <deaths|kills|playtime|money> <player>
  pizzasusflag:
    usage: /pizzasusflag <player> <checkName> <vl>
  txlog:
    usage: /txlog [player] [page]
  pizzadebug:
    usage: /pizzadebug hud
  admindelhome:
    usage: /admindelhome <player> <home>
permissions:
  pizzasmp.manage:
    description: Access the backend management console (/manage). Dev + granted admins.
    default: false
  pizzasmp.manage.grant:
    description: Grant/revoke /manage access to other staff (dev only).
    default: false
  pizzasmp.admin.console:
    description: Open the in-game server admin console (/admin).
    default: op
  pizzasmp.settings.fastauction:
    default: op
  pizzasmp.sell.reload:
    default: op
  pizzasmp.sync.reconnect.bypass:
    default: false
  pizzasmp.use.shop:
    default: true
  pizzasmp.use.ah:
    default: true
  pizzasmp.use.orders:
    default: true
  pizzasmp.use.afk:
    default: true
  pizzasmp.use.settings:
    default: true
  pizzasmp.use.stats:
    default: true
  pizzasmp.use.rtp:
    default: true
  pizzasmp.rtp.use:
    default: true
  pizzasmp.rank.pizzaplus:
    default: false
  pizzasmp.homes.open:
    default: true
  pizzasmp.homes.limit.2:
    default: true
  pizzasmp.homes.limit.5:
    default: false
  pizzasmp.homes.delete:
    default: true
  pizzasmp.teamhome.set:
    default: false
  pizzasmp.use.discord:
    default: true
  pizzasmp.shop.admin.reload:
    default: op
  pizzasmp.shop.admin.edit:
    default: op
  pizzasmp.rtp.cooldown.priority:
    default: false
  pizzasmp.teleport.delay.bypass:
    default: op
  pizzasmp.chat.global:
    default: true
  pizzasmp.chat.msg:
    default: true
  pizzasmp.chat.team:
    default: true
  pizzasmp.staff.gtp:
    default: op
  pizzasmp.admin.eco:
    default: op
  pizzasmp.admin.debug:
    default: op
  pizzasmp.admin.commands:
    default: op
  pizzasmp.admin.shards:
    default: op
  pizzasmp.admin.reset:
    default: op
  pizzasmp.admin.viewdistance:
    default: op
  pizzasmp.admin.diagnostics:
    default: op
  pizzasmp.gamemode.flight.bypass:
    default: op
  pizzasmp.spawnedit:
    default: op
  pizzasmp.pl.view:
    default: op
  pizzasmp.plugins.view:
    default: op
  pizzasmp.admin.homes:
    default: op
