name: PizzaChatGuard
main: dev.pizzasmp.chat.PizzaChatGuard
version: 2.0.0
authors:
  - FolksyPizza
api-version: 1.21.6
description: "False-positive-resistant chat filter: slurs, advertising, spam, caps."
softdepend:
  - PunishDrop
  - LibertyBans
# SuiteStorage needs a JDBC driver and a pool to put shared state in the database.
# Paper's runtime library loader fetches these; without the block the plugin loads and
# then silently falls back to per-server YAML files.
libraries:
  - org.mariadb.jdbc:mariadb-java-client:3.5.4
  - com.zaxxer:HikariCP:5.1.0
commands:
  clearwarnings:
    description: "Clear PizzaChatGuard warning count for a player."
    usage: "/clearwarnings <player>"
    aliases:
      - clearwarn
      - clearwarns
    permission: pizzasmp.chatguard.clearwarnings
  pizzachatguard:
    description: "PizzaChatGuard help / reload."
    usage: "/pizzachatguard [reload]"
    aliases:
      - pcg
permissions:
  pizzasmp.chatguard.clearwarnings:
    description: "Clear PizzaChatGuard warnings and reload config."
    default: op
  pizzasmp.chatguard.bypass:
    description: "Bypass the chat filter entirely (must be explicitly granted; even staff are filtered by default)."
    default: false
