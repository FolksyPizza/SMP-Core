# PizzaChatGuard — false-positive-resistant chat filter
enabled: true

# Spam controls
rate-limit-ms: 250          # minimum ms between a player's messages
duplicate-window-ms: 3000   # block identical message repeated within this window

# Caps filter (only triggers on longer messages that are mostly uppercase)
caps-min-length: 8          # only check messages with at least this many letters
caps-threshold: 0.7         # >=70% uppercase = caps violation

block-advertising: true     # block IPs and domain names (server advertising)

# Slurs / hate speech — matched as WHOLE WORDS after leet-speak normalization.
# Keep this list specific. Word-boundary matching means these never match inside
# innocent words. (Add entries lowercase; leet variants are handled automatically.)
